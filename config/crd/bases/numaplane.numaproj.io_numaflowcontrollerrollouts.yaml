---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: numaflowcontrollerrollouts.numaplane.numaproj.io
spec:
  group: numaplane.numaproj.io
  names:
    kind: NumaflowControllerRollout
    listKind: NumaflowControllerRolloutList
    plural: numaflowcontrollerrollouts
    singular: numaflowcontrollerrollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: The current phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: The desired Numaflow Controller version
      jsonPath: .spec.controller.version
      name: Version
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NumaflowControllerRollout is the Schema for the numaflowcontrollerrollouts
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NumaflowControllerRolloutSpec defines the desired state of
              NumaflowControllerRollout
            properties:
              controller:
                properties:
                  instanceID:
                    description: |-
                      InstanceID seeds the instance of the first NumaflowController child created for this Rollout.
                      Once a child exists, its instance is fixed for its lifetime: renaming the underlying Deployment would
                      orphan every Pipeline and MonoVertex bound to it, since Numaflow does not allow their instance annotation
                      to change. Children created by a Progressive upgrade derive their own instance (see ControllerInstanceRef).
                    type: string
                  version:
                    type: string
                required:
                - version
                type: object
              strategy:
                description: ControllerStrategy defines the strategy to use when upgrading
                  the NumaflowController
                properties:
                  progressive:
                    description: ControllerProgressiveStrategy defines the configuration
                      for a progressive upgrade of the NumaflowController
                    properties:
                      assessmentSchedule:
                        description: |-
                          AssessmentSchedule describes the schedule for how often we assess the health of the upgrading controller instance,
                          in the format "delay,end,period,interval" (see config.AssessmentSchedule)
                        type: string
                    type: object
                type: object
            required:
            - controller
            type: object
          status:
            description: NumaflowControllerRolloutStatus defines the observed state
              of NumaflowControllerRollout
            properties:
              conditions:
                description: Conditions are the latest available observations of a
                  resource's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controllerInstances:
                description: ControllerInstances holds one entry for each live NumaflowController
                  child, whether promoted or trial.
                items:
                  description: ControllerInstanceRef represents a live NumaflowController
                    child, either promoted or trial.
                  properties:
                    instanceID:
                      description: |-
                        InstanceID is stamped into the child controller's spec and into every Pipeline or MonoVertex bound to this
                        controller instance. A trial child derives it as "<version>-<nameCount>" (with the version reduced to
                        lowercase letters, digits, and dashes so it stays valid inside Service names), so re-trialing the same
                        version after a failed trial still yields a distinct instance. The controller that existed before
                        Progressive was introduced keeps an empty instance.
                      type: string
                    name:
                      description: Name of the child NumaflowController CR, e.g. "numaflow-controller-2".
                      type: string
                    referencingInterStepBufferServices:
                      description: |-
                        ReferencingInterStepBufferServices and ReferencingMonovertices are live counts of ISBServices and MonoVertices,
                        respectively, currently bound to this instance. Pipelines are not counted directly: a Pipeline's ISBSvc is not
                        deleted while that Pipeline still references it, so counting ISBServices already transitively captures
                        Pipeline usage. Both fields are consulted exclusively by Recycle() as a deletion-safety gate, once a controller
                        instance has already been marked recyclable.
                      format: int32
                      type: integer
                    referencingMonovertices:
                      format: int32
                      type: integer
                    state:
                      description: 'State reuses the existing common.UpgradeState
                        values: "promoted" or "trial".'
                      type: string
                    version:
                      type: string
                  required:
                  - instanceID
                  - name
                  - referencingInterStepBufferServices
                  - referencingMonovertices
                  - state
                  - version
                  type: object
                type: array
              lastFailureTime:
                description: LastFailureTime records the timestamp of the Last Failure
                  (PhaseFailed)
                format: date-time
                type: string
              message:
                description: Message is added if Phase is PhaseFailed.
                type: string
              nameCount:
                description: |-
                  NameCount is used as a suffix for the name of the managed NumaflowController children, to uniquely
                  identify each child.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration stores the generation value observed
                  when setting the current Phase
                format: int64
                type: integer
              pauseRequestStatus:
                description: PauseStatus is a common structure used to communicate
                  how long Pipelines are paused.
                properties:
                  lastPauseBeginTime:
                    description: The begin timestamp for the last pause of the Pipeline.
                    format: date-time
                    type: string
                  lastPauseEndTime:
                    description: The end timestamp for the last pause of the Pipeline.
                    format: date-time
                    type: string
                  lastPausePhaseChangeTime:
                    description: The transition timestamp from Pausing to Paused for
                      the last pause of the Pipeline.
                    format: date-time
                    type: string
                type: object
              phase:
                description: Phase indicates the current phase of the resource.
                enum:
                - ""
                - Pending
                - Deployed
                - Failed
                type: string
              progressiveStatus:
                description: ProgressiveStatus stores fields related to the Progressive
                  strategy
                properties:
                  promotedNumaflowControllerStatus:
                    description: PromotedNumaflowControllerStatus stores information
                      regarding the current "promoted" NumaflowController
                    properties:
                      name:
                        description: Name of the promoted child
                        type: string
                    required:
                    - name
                    type: object
                  upgradingNumaflowControllerStatus:
                    description: UpgradingNumaflowControllerStatus represents either
                      the current or otherwise the most recent "upgrading" NumaflowController
                    properties:
                      assessmentResult:
                        description: AssessmentResult described whether it's failed
                          or succeeded, or to be determined
                        type: string
                      basicAssessmentEndTime:
                        description: BasicAssessmentEndTime indicates the time after
                          which no more basic resource health check assessments will
                          be performed
                        format: date-time
                        type: string
                      basicAssessmentResult:
                        description: BasicAssessmentResult indicates the result of
                          the basic resource health check assessment
                        type: string
                      basicAssessmentStartTime:
                        description: BasicAssessmentStartTime indicates the time at/after
                          which the basic resource health check assessment result
                          will be computed
                        format: date-time
                        type: string
                      childStatus:
                        description: ChildStatus is the full dump of child status
                          object
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      discontinued:
                        description: |-
                          Discontinued indicates if the upgrade was stopped prematurely.
                          This can happen if the upgrade gets preempted by a new change, or it can happen if user deletes their promoted pipeline
                          in the middle of an upgrade
                        type: boolean
                      failureReasons:
                        description: FailureReasons is an array of strings indicating
                          the reasons for failure
                        items:
                          type: string
                        type: array
                      forcedSuccess:
                        description: ForcedSuccess indicates if this promotion was
                          forced to complete
                        type: boolean
                      forcedSuccessReason:
                        description: ForcedSuccessReason indicates the reason for
                          the forced success
                        type: string
                      initializationComplete:
                        description: InitializationComplete determines if the upgrade
                          process has completed (if it hasn't, we will come back and
                          try it again)
                        type: boolean
                      name:
                        description: Name of the upgrading child
                        type: string
                      riders:
                        description: Riders stores the list of Riders that have been
                          deployed along with the "upgrading" child
                        items:
                          description: Rider represents a Rider which has been deployed
                            for a promoted child
                          properties:
                            groupVersionKind:
                              description: |-
                                GroupVersionKind unambiguously identifies a kind.  It doesn't anonymously include GroupVersion
                                to avoid automatic coercion.  It doesn't use a GroupVersion to avoid custom marshalling
                              properties:
                                group:
                                  type: string
                                kind:
                                  type: string
                                version:
                                  type: string
                              required:
                              - group
                              - kind
                              - version
                              type: object
                            name:
                              type: string
                          required:
                          - groupVersionKind
                          - name
                          type: object
                        type: array
                      trialWindowStartTime:
                        description: TrialWindowStartTime indicates the time at which
                          the trial window starts
                        format: date-time
                        type: string
                    required:
                    - name
                    type: object
                type: object
              upgradeInProgress:
                description: UpgradeInProgress indicates the upgrade strategy currently
                  being used and affecting the resource state or empty if no upgrade
                  is in progress
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
