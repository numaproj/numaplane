apiVersion: numaplane.numaproj.io/v1alpha1
kind: MonoVertexRollout
metadata:
  name: my-monovertex
  namespace: example-namespace
spec:
  strategy:
    #progressive: # only required if we need to override the defaults in numaplane-controller-config ConfigMap
    #  assessmentSchedule: "10,200,60,10"
    analysis:
      templates:
      - templateName: monovertex-template
        clusterScope: false
  riders: # can be defined here for resources that need to be deployed per-Monovertex

  monoVertex:
    metadata:
      annotations:
        my-templated-annotation: '{{.monovertex-namespace}}-{{.monovertex-name}}'
    spec:
      scale:
        min: 2
        max: 3
        lookbackSeconds: 60
      source:
        udsource:
          container:
            image: quay.io/numaio/numaflow-go/source-simple-source:stable
        transformer:
          container:
            image: quay.io/numaio/numaflow-rs/source-transformer-now:stable
      sink:
        udsink:
          container:
            image: quay.io/numaio/numaflow-go/sink-log:stable
            #image: quay.io/numaio/numaflow-go/sink-log-failure:stable # use to fail the AnalysisRun
---

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: monovertex-template
  namespace: example-namespace
  labels:
    used_by: numaplane
spec:
  args:
    - name: upgrading-monovertex-name
    - name: monovertex-namespace
    # Shared by metric interval, initialDelay, and the PromQL range lookback.
    # 60s spans ~2 Prometheus scrapes at the default 30s interval; matches UBC production config.
    - name: interval
      value: 60s
    - name: success-limit
      value: "3"
    - name: no-critical-errors-failure-limit
      value: "0"
    - name: acknowledged-messages-failure-limit
      value: "3"
  metrics:
  - name: no-critical-errors
    consecutiveSuccessLimit: '{{args.success-limit}}'
    failureLimit: '{{args.no-critical-errors-failure-limit}}'
    interval: '{{args.interval}}'
    # Each measurement looks back one interval, so consecutive measurements cover the whole run.
    initialDelay: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        # Numaflow >= 1.8.0 (monovtx_critical_error_total, numaflow#3154).
        # Fail if the MonoVertex reported a critical error (EOT, UDF crash, etc.) at any point in the window.
        # The counter is created by the first error and goes stale once the numa container restarts,
        # so check every sample in the window rather than the latest value or increase().
        # absent_over_time() passes a healthy MonoVertex, and Numaflow < 1.8, which has no such metric.
        query: |
          (
            sum(max_over_time(monovtx_critical_error_total{namespace="{{args.monovertex-namespace}}", mvtx_name="{{args.upgrading-monovertex-name}}"}[{{args.interval}}])) == bool 0
          )
          or
          (
            absent_over_time(monovtx_critical_error_total{namespace="{{args.monovertex-namespace}}", mvtx_name="{{args.upgrading-monovertex-name}}"}[{{args.interval}}])
          )
    successCondition: len(result) > 0 && result[0] > 0
  - name: acknowledged-messages
    consecutiveSuccessLimit: '{{args.success-limit}}'
    failureLimit: '{{args.acknowledged-messages-failure-limit}}'
    interval: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        # Legacy read/ack check; provides validation on Numaflow < 1.8 where critical-error metric is absent.
        # Pass when no reads yet, or at least one ack has been recorded.
        query: (vector(1) and on() ((sum(numaflow_monovtx_read_total{namespace="{{args.monovertex-namespace}}",
          mvtx_name="{{args.upgrading-monovertex-name}}"}) or vector(0)) == 0)) or
          (vector(1) and on() ((sum(numaflow_monovtx_ack_total{namespace="{{args.monovertex-namespace}}",
          mvtx_name="{{args.upgrading-monovertex-name}}"}) or vector(0)) > 0)) or
          vector(0)
    successCondition: len(result) > 0 && result[0] > 0