apiVersion: numaplane.numaproj.io/v1alpha1
kind: MonoVertexRollout
metadata:
  name: my-monovertex
  namespace: example-namespace
spec:
  strategy:
    #progressive: # only required if we need to override the defaults in numaplane-controller-config ConfigMap
    #  assessmentSchedule: "10,200,60,10"
    analysis:
      templates:
      - templateName: mvtx-no-critical-errors
        clusterScope: false
  riders: # can be defined here for resources that need to be deployed per-Monovertex

  monoVertex:
    metadata:
      annotations:
        my-templated-annotation: '{{.monovertex-namespace}}-{{.monovertex-name}}'
    spec:
      scale:
        min: 2
        max: 3
        lookbackSeconds: 60
      source:
        udsource:
          container:
            image: quay.io/numaio/numaflow-go/source-simple-source:stable
        transformer:
          container:
            image: quay.io/numaio/numaflow-rs/source-transformer-now:stable
      sink:
        udsink:
          container:
            image: quay.io/numaio/numaflow-go/sink-log:stable
            #image: quay.io/numaio/numaflow-go/sink-log-failure:stable # use to fail the AnalysisRun
---

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mvtx-no-critical-errors
  namespace: example-namespace
  labels:
    used_by: numaplane
spec:
  args:
    - name: upgrading-monovertex-name
    - name: monovertex-namespace
    # Shared by metric interval, initialDelay, and the PromQL increase() lookback.
    # Align with the MonoVertex defaultAssessmentSchedule consecutive-health period (60s).
    - name: interval
      value: 60s
    - name: success-limit
      value: "3"
    - name: failure-limit
      value: "3"
  metrics:
  - name: no-critical-errors
    consecutiveSuccessLimit: '{{args.success-limit}}'
    failureLimit: '{{args.failure-limit}}'
    interval: '{{args.interval}}'
    # Wait one interval after AnalysisRun creation before the first Prometheus query so the
    # increase() lookback does not overlap the upgrading MonoVertex health ramp-up window.
    initialDelay: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        # Requires Numaflow >= 1.8.0 (monovtx_critical_error_total, numaflow#3154).
        # Pass when no critical errors (EOT, UDF crash, etc.) occurred in the lookback window.
        # absent() treats assets with no traffic / no counter yet as healthy.
        query: |
          (
            sum(increase(monovtx_critical_error_total{namespace="{{args.monovertex-namespace}}", mvtx_name="{{args.upgrading-monovertex-name}}"}[{{args.interval}}])) == 0
          )
          or
          (
            absent(monovtx_critical_error_total{namespace="{{args.monovertex-namespace}}", mvtx_name="{{args.upgrading-monovertex-name}}"})
          )
    successCondition: len(result) > 0 && result[0] > 0