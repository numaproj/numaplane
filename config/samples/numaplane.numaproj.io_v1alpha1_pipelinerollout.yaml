apiVersion: numaplane.numaproj.io/v1alpha1
kind: PipelineRollout
metadata:
  name: my-pipeline
  namespace: example-namespace
spec:
  strategy:
    #progressive: # only required if we need to override the defaults in numaplane-controller-config ConfigMap
    #  assessmentSchedule: "10,200,60,10"
    analysis:
      templates:
      - templateName: pipeline-template
        clusterScope: false
  riders: # can be defined here for resources that need to be deployed per-Pipeline or per-Vertex

  # the Pipeline definition in Numaflow
  pipeline:
    metadata:
      annotations:
    #    numaflow.numaproj.io/instance: "0" # uncomment for Progressive rollout to set Numaflow Controller instance
        my-templated-annotation: '{{.pipeline-namespace}}-{{.pipeline-name}}'
    spec:
      lifecycle:
        pauseGracePeriodSeconds: 60
      interStepBufferServiceName: my-isbsvc
      vertices:
        - name: in
          scale: 
            #min: 3
            #max: 5
            loopbackSeconds: 180
          
          source:
            # A self data generating source
            generator:
              rpu: 500
              duration: 1s
        - name: cat
          scale: 
            min: 3
            max: 5
          udf:
            container:
              image: "quay.io/numaio/numaflow-go/map-cat:stable" # A built-in UDF which simply cats the message
              imagePullPolicy: Always
        - name: out
          sink:
            # A simple log printing sink
            log: {}
      edges:
        - from: in
          to: cat
        - from: cat
          to: out

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pipeline-template
  namespace: example-namespace
  labels:
    used_by: numaplane
spec:
  args:
    - name: upgrading-pipeline-name
    - name: pipeline-namespace
    # Shared by metric interval, initialDelay, and the PromQL range lookback.
    # 60s spans ~2 Prometheus scrapes at the default 30s interval; matches UBC production config.
    - name: interval
      value: 60s
    # Read/ack metrics keep the limits this template was tested with.
    - name: ack-success-limit
      value: "4"
    - name: ack-failure-limit
      value: "6"
    - name: no-critical-errors-success-limit
      value: "4"
    - name: no-critical-errors-failure-limit
      value: "0"
  # One critical-error metric and one read/ack metric per vertex (in, cat, out).
  metrics:
  - name: in-no-critical-errors
    consecutiveSuccessLimit: '{{args.no-critical-errors-success-limit}}'
    failureLimit: '{{args.no-critical-errors-failure-limit}}'
    interval: '{{args.interval}}'
    # Each measurement looks back one interval, so consecutive measurements cover the whole run.
    initialDelay: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        # Numaflow >= 1.8.0 (forwarder_critical_error_total, numaflow#3154).
        # Fail if this vertex reported a critical error (EOT, UDF crash, etc.) at any point in the window.
        # The counter is created by the first error and goes stale once the numa container restarts,
        # so check every sample in the window rather than the latest value or increase().
        # absent_over_time() passes a healthy vertex, and Numaflow < 1.8, which has no such metric.
        query: |
          (
            sum(max_over_time(forwarder_critical_error_total{namespace="{{args.pipeline-namespace}}", pipeline="{{args.upgrading-pipeline-name}}", vertex="in"}[{{args.interval}}])) == bool 0
          )
          or
          (
            absent_over_time(forwarder_critical_error_total{namespace="{{args.pipeline-namespace}}", pipeline="{{args.upgrading-pipeline-name}}", vertex="in"}[{{args.interval}}])
          )
    successCondition: len(result) > 0 && result[0] > 0
  - name: in-ack
    consecutiveSuccessLimit: '{{args.ack-success-limit}}'
    failureLimit: '{{args.ack-failure-limit}}'
    interval: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        query: (vector(1) and on() ((sum(numaflow_forwarder_read_total{namespace="{{args.pipeline-namespace}}",
          pipeline="{{args.upgrading-pipeline-name}}", vertex="in"}) or vector(0))
          == 0)) or (vector(1) and on() ((sum(numaflow_forwarder_ack_total{namespace="{{args.pipeline-namespace}}",
          pipeline="{{args.upgrading-pipeline-name}}", vertex="in"}) or vector(0))
          > 0)) or vector(0)
    successCondition: len(result) > 0 && result[0] > 0
  - name: cat-no-critical-errors
    consecutiveSuccessLimit: '{{args.no-critical-errors-success-limit}}'
    failureLimit: '{{args.no-critical-errors-failure-limit}}'
    interval: '{{args.interval}}'
    initialDelay: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        query: |
          (
            sum(max_over_time(forwarder_critical_error_total{namespace="{{args.pipeline-namespace}}", pipeline="{{args.upgrading-pipeline-name}}", vertex="cat"}[{{args.interval}}])) == bool 0
          )
          or
          (
            absent_over_time(forwarder_critical_error_total{namespace="{{args.pipeline-namespace}}", pipeline="{{args.upgrading-pipeline-name}}", vertex="cat"}[{{args.interval}}])
          )
    successCondition: len(result) > 0 && result[0] > 0
  - name: cat-ack
    consecutiveSuccessLimit: '{{args.ack-success-limit}}'
    failureLimit: '{{args.ack-failure-limit}}'
    interval: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        query: (vector(1) and on() ((sum(numaflow_forwarder_read_total{namespace="{{args.pipeline-namespace}}",
          pipeline="{{args.upgrading-pipeline-name}}", vertex="cat"})
          or vector(0)) == 0)) or (vector(1) and on() ((sum(numaflow_forwarder_ack_total{namespace="{{args.pipeline-namespace}}",
          pipeline="{{args.upgrading-pipeline-name}}", vertex="cat"})
          or vector(0)) > 0)) or vector(0)
    successCondition: len(result) > 0 && result[0] > 0
  - name: out-no-critical-errors
    consecutiveSuccessLimit: '{{args.no-critical-errors-success-limit}}'
    failureLimit: '{{args.no-critical-errors-failure-limit}}'
    interval: '{{args.interval}}'
    initialDelay: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        query: |
          (
            sum(max_over_time(forwarder_critical_error_total{namespace="{{args.pipeline-namespace}}", pipeline="{{args.upgrading-pipeline-name}}", vertex="out"}[{{args.interval}}])) == bool 0
          )
          or
          (
            absent_over_time(forwarder_critical_error_total{namespace="{{args.pipeline-namespace}}", pipeline="{{args.upgrading-pipeline-name}}", vertex="out"}[{{args.interval}}])
          )
    successCondition: len(result) > 0 && result[0] > 0
  - name: out-ack
    consecutiveSuccessLimit: '{{args.ack-success-limit}}'
    failureLimit: '{{args.ack-failure-limit}}'
    interval: '{{args.interval}}'
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        query: (vector(1) and on() ((sum(numaflow_forwarder_read_total{namespace="{{args.pipeline-namespace}}",
          pipeline="{{args.upgrading-pipeline-name}}", vertex="out"}) or vector(0))
          == 0)) or (vector(1) and on() ((sum(numaflow_forwarder_ack_total{namespace="{{args.pipeline-namespace}}",
          pipeline="{{args.upgrading-pipeline-name}}", vertex="out"}) or vector(0))
          > 0)) or vector(0)
    successCondition: len(result) > 0 && result[0] > 0
