apiVersion: v1
kind: ConfigMap
metadata:
  name: numaplane-controller-usde-config
  labels:
    numaplane.numaproj.io/config: usde-config
data:
  pipeline: |
    recreate:
      # Principal: Changing the InterstepBufferService could cause data loss since unconsumed data may be left on the InterstepBufferService which won't get processed.
      # Furthermore, this change needs to recreate the pipeline so that ISBSvc buckets and buffers are also recreated.
      - path: spec.interStepBufferServiceName
    dataLoss:
      # Principal: Pipeline topology change could cause data loss since unconsumed data may be left on the InterstepBufferService which won't get processed
      - path: spec.edges.from
      - path: spec.edges.to
      - path: spec.edges.conditions
        includeSubfields: true

      # Principal: Changing an Image definition could cause data loss if the new Image is not able to process the old data from the InterstepBufferService
      - path: spec.vertices.containerTemplate.env
        includeSubfields: true
      - path: spec.vertices.containerTemplate.envFrom
        includeSubfields: true
      - path: spec.vertices.initContainerTemplate.env
        includeSubfields: true
      - path: spec.vertices.initContainerTemplate.envFrom
        includeSubfields: true 
      - path: spec.vertices.source.generator
      - path: spec.vertices.source.kafka
      - path: spec.vertices.source.http
      - path: spec.vertices.source.nats
      - path: spec.vertices.source.jetstream
      - path: spec.vertices.source.serving
      - path: spec.vertices.source.udsource.container.image
      - path: spec.vertices.source.udsource.container.volumeMounts
        includeSubfields: true
      - path: spec.vertices.source.udsource.container.command
      - path: spec.vertices.source.udsource.container.args
      - path: spec.vertices.source.udsource.container.env
        includeSubfields: true
      - path: spec.vertices.source.udsource.container.envFrom
        includeSubfields: true
      - path: spec.vertices.source.transformer.container.image
      - path: spec.vertices.source.transformer.container.volumeMounts
        includeSubfields: true
      - path: spec.vertices.source.transformer.container.command
      - path: spec.vertices.source.transformer.container.args
      - path: spec.vertices.source.transformer.container.env
        includeSubfields: true
      - path: spec.vertices.source.transformer.container.envFrom
        includeSubfields: true
      - path: spec.vertices.source.transformer.builtin
        includeSubfields: true
      - path: spec.vertices.sink.kafka
      - path: spec.vertices.sink.serve
      - path: spec.vertices.sink.sqs
      - path: spec.vertices.sink.pulsar
      - path: spec.vertices.sink.udsink.container.image
      - path: spec.vertices.sink.udsink.container.volumeMounts
        includeSubfields: true
      - path: spec.vertices.sink.udsink.container.command
      - path: spec.vertices.sink.udsink.container.args
      - path: spec.vertices.sink.udsink.container.env
        includeSubfields: true
      - path: spec.vertices.sink.udsink.container.envFrom
        includeSubfields: true
      - path: spec.vertices.sink.fallback.udsink.container.image
      - path: spec.vertices.sink.fallback.udsink.container.volumeMounts
        includeSubfields: true
      - path: spec.vertices.sink.fallback.udsink.container.command
      - path: spec.vertices.sink.fallback.udsink.container.args
      - path: spec.vertices.sink.fallback.udsink.container.env
        includeSubfields: true
      - path: spec.vertices.sink.fallback.udsink.container.envFrom
        includeSubfields: true
      - path: spec.vertices.sink.onSuccess.udsink.container.image
      - path: spec.vertices.sink.onSuccess.udsink.container.volumeMounts
        includeSubfields: true
      - path: spec.vertices.sink.onSuccess.udsink.container.command
      - path: spec.vertices.sink.onSuccess.udsink.container.args
      - path: spec.vertices.sink.onSuccess.udsink.container.env
        includeSubfields: true
      - path: spec.vertices.sink.onSuccess.udsink.container.envFrom
        includeSubfields: true
      - path: spec.vertices.udf.container.image
      - path: spec.vertices.udf.container.volumeMounts
        includeSubfields: true
      - path: spec.vertices.udf.container.command
      - path: spec.vertices.udf.container.args
      - path: spec.vertices.udf.container.env
        includeSubfields: true
      - path: spec.vertices.udf.container.envFrom
        includeSubfields: true
      - path: spec.vertices.initContainers.image
      - path: spec.vertices.initContainers.volumeMounts
        includeSubfields: true
      - path: spec.vertices.initContainers.command
      - path: spec.vertices.initContainers.args
      - path: spec.vertices.initContainers.env
        includeSubfields: true
      - path: spec.vertices.initContainers.envFrom
        includeSubfields: true
      - path: spec.vertices.sidecars.image
      - path: spec.vertices.sidecars.volumeMounts
        includeSubfields: true
      - path: spec.vertices.sidecars.command
      - path: spec.vertices.sidecars.args
      - path: spec.vertices.sidecars.env
        includeSubfields: true
      - path: spec.vertices.sidecars.envFrom
        includeSubfields: true
      - path: spec.vertices.volumes
        includeSubfields: true
      - path: spec.vertices.udf.builtin
        includeSubfields: true
      - path: spec.sideInputs.container.image
      - path: spec.sideInputs.container.volumeMounts
        includeSubfields: true
      - path: spec.sideInputs.container.command
      - path: spec.sideInputs.container.args
      - path: spec.sideInputs.container.env
        includeSubfields: true
      - path: spec.sideInputs.container.envFrom
        includeSubfields: true
      - path: spec.templates     # note: this one could be broken down further into just the fields that are at risk
        includeSubfields: true
      - path: spec.ordered
      - path: spec.vertices.ordered
        includeSubfields: true
      - path: spec.interStepBuffer
        includeSubfields: true
    progressive:
      # Decision: Many of the fields inside of these source types and sink types are risky to change and could warrant doing Progressive Rollout
      # There are too many different fields to go through each one and determine if it is, so for simplicity we do Progressive Rollout for all.
      - path: spec.vertices.source.generator
        includeSubfields: true
      - path: spec.vertices.source.kafka
        includeSubfields: true
      - path: spec.vertices.source.http
        includeSubfields: true
      - path: spec.vertices.source.nats
        includeSubfields: true
      - path: spec.vertices.source.jetstream
        includeSubfields: true
      - path: spec.vertices.source.serving
        includeSubfields: true
      - path: spec.vertices.source.pulsar
        includeSubfields: true
      - path: spec.vertices.source.sqs
        includeSubfields: true
      
      - path: spec.vertices.sink.kafka
        includeSubfields: true
      - path: spec.vertices.sink.serve
        includeSubfields: true
      - path: spec.vertices.sink.sqs
        includeSubfields: true
      - path: spec.vertices.sink.pulsar
        includeSubfields: true
      
  interstepbufferservice: |
    recreate:
      # Changing persistence settings and number of replicas needs to recreate both the ISBSvc and also the pipelines associated to it to 
      # recreate the buckets and buffers which are only recreated when a pipeline is started.
      - path: spec.jetstream.replicas
      - path: spec.redis.native.replicas
      - path: spec.jetstream.persistence
        includeSubfields: true
      - path: spec.redis.native.persistence
        includeSubfields: true
  
      # changing any field in the buffer configuration won't result in an update to existing buffers so we need to create new pipelines
      - path: spec.jetstream.bufferConfig
        includeSubfields: true
    
      # This checks if the spec changed from jetstream to redis and viceversa. In this case, the ISBSvc and associated pipelines will need to be recreated.
      - path: spec.jetstream
      - path: spec.redis
    dataLoss:
      # Principal: Update to StatefulSet may not be backward compatible to understand the data on the PVC
      - path: spec.jetstream.version
      - path: spec.redis.native.version
      - path: spec.redis.external.url
      - path: spec.redis.external.sentinelUrl
      - path: spec.redis.external.masterName
  monovertex: |
    progressive:
      - path: spec.containerTemplate.env
        includeSubfields: true
      - path: spec.containerTemplate.envFrom
        includeSubfields: true
      - path: spec.initContainers.image
      - path: spec.initContainers.volumeMounts
        includeSubfields: true
      - path: spec.initContainers.command
      - path: spec.initContainers.args
      - path: spec.initContainers.env
        includeSubfields: true
      - path: spec.initContainers.envFrom
        includeSubfields: true
      - path: spec.sidecars.image
      - path: spec.sidecars.volumeMounts
        includeSubfields: true
      - path: spec.sidecars.command
      - path: spec.sidecars.args
      - path: spec.sidecars.env
        includeSubfields: true
      - path: spec.sidecars.envFrom
        includeSubfields: true
      - path: spec.sink.fallback.udsink.container.image
      - path: spec.sink.fallback.udsink.container.volumeMounts
        includeSubfields: true
      - path: spec.sink.fallback.udsink.container.command
      - path: spec.sink.fallback.udsink.container.args
      - path: spec.sink.fallback.udsink.container.env
        includeSubfields: true
      - path: spec.sink.fallback.udsink.container.envFrom
        includeSubfields: true
      - path: spec.sink.udsink.container.image
      - path: spec.sink.udsink.container.volumeMounts
        includeSubfields: true
      - path: spec.sink.udsink.container.command
      - path: spec.sink.udsink.container.args
      - path: spec.sink.udsink.container.env
        includeSubfields: true
      - path: spec.sink.udsink.container.envFrom
        includeSubfields: true
      - path: spec.sink.onSuccess.udsink.container.image
      - path: spec.sink.onSuccess.udsink.container.volumeMounts
        includeSubfields: true
      - path: spec.sink.onSuccess.udsink.container.command
      - path: spec.sink.onSuccess.udsink.container.args
      - path: spec.sink.onSuccess.udsink.container.env
        includeSubfields: true
      - path: spec.sink.onSuccess.udsink.container.envFrom
        includeSubfields: true
      - path: spec.source.transformer.container.image
      - path: spec.source.transformer.container.volumeMounts
        includeSubfields: true
      - path: spec.source.transformer.container.command
      - path: spec.source.transformer.container.args
      - path: spec.source.transformer.container.env
        includeSubfields: true
      - path: spec.source.transformer.container.envFrom
        includeSubfields: true
      - path: spec.source.udsource.container.image
      - path: spec.source.udsource.container.volumeMounts
        includeSubfields: true
      - path: spec.source.udsource.container.command
      - path: spec.source.udsource.container.args
      - path: spec.source.udsource.container.env
        includeSubfields: true
      - path: spec.source.udsource.container.envFrom
        includeSubfields: true
      - path: spec.udf.container.image
      - path: spec.udf.container.volumeMounts
        includeSubfields: true
      - path: spec.udf.container.command
      - path: spec.udf.container.args
      - path: spec.udf.container.env
        includeSubfields: true
      - path: spec.udf.container.envFrom
        includeSubfields: true
      - path: spec.volumes
        includeSubfields: true
      - path: spec.bypass
        includeSubfields: true

      # Decision: Many of the fields inside of these source types and sink types are risky to change and could warrant doing Progressive Rollout
      # There are too many different fields to go through each one and determine if it is, so for simplicity we do Progressive Rollout for all.
      - path: spec.source.generator
        includeSubfields: true
      - path: spec.source.kafka
        includeSubfields: true
      - path: spec.source.http
        includeSubfields: true
      - path: spec.source.nats
        includeSubfields: true
      - path: spec.source.jetstream
        includeSubfields: true
      - path: spec.source.serving
        includeSubfields: true
      - path: spec.source.pulsar
        includeSubfields: true
      - path: spec.source.sqs
        includeSubfields: true

      - path: spec.sink.kafka
        includeSubfields: true
      - path: spec.sink.serve
        includeSubfields: true
      - path: spec.sink.sqs
        includeSubfields: true
      - path: spec.sink.pulsar
        includeSubfields: true
  numaflowcontroller: |
    dataLoss:
     - path: spec.version
